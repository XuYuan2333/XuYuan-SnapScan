<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XuYuan-SnapScan</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

<header class="topbar">
  <div class="brand">
    <div class="logo"><img src="app.ico" alt="XuYuan-SnapScan"></div>
    <div class="brand-text">
      <h1>XuYuan-SnapScan</h1>
      <p>截图 · 二维码 · 文字识别</p>
    </div>
  </div>

  <div class="top-right">
    <div class="engine-pill" id="enginePill" title="当前真正可用的识别引擎">
      <span class="dot" id="engineDot"></span>
      <span id="enginePillText">检测中…</span>
    </div>
    <button class="icon-btn" id="btnSettings" title="设置">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Zm7.4-2.9c.04-.3.06-.6.06-.9s-.02-.6-.07-.9l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.6-.9l-.3-2.5h-4l-.3 2.5c-.6.2-1.1.5-1.6.9l-2.4-1-2 3.4 2 1.5c-.05.3-.07.6-.07.9s.02.6.07.9l-2 1.5 2 3.4 2.4-1c.5.4 1 .7 1.6.9l.3 2.5h4l.3-2.5c.6-.2 1.1-.5 1.6-.9l2.4 1 2-3.4-2-1.5Z"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>

<main class="layout">
  <section class="panel result-panel">
    <div class="panel-head">
      <div class="panel-title">
        <span>识别结果</span>
        <em id="resultMeta">等待识别</em>
      </div>
      <div class="panel-actions">
        <button class="btn ghost" id="btnClear">清空</button>
        <button class="btn ghost" id="btnCopy">复制</button>
      </div>
    </div>
    <div class="result-wrap">
      <div id="result" class="result-box" contenteditable="true" spellcheck="false"
           data-placeholder="识别结果会出现在这里 — 可以直接选中、编辑、复制"></div>
    </div>
    <div class="hint-row">
      <span>内容可编辑 · 支持鼠标选中与 Ctrl+A / Ctrl+C</span>
      <span id="copyTip" class="copy-tip"></span>
    </div>
  </section>

  <aside class="side">
    <section class="panel action-panel">
      <div class="panel-title"><span>开始识别</span></div>
      <button class="shot-btn" id="btnQr">
        <span class="shot-ico">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 4h6v6H4V4Zm10 0h6v6h-6V4ZM4 14h6v6H4v-6Zm10 3h3v3h-3v-3Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        </span>
        <span class="shot-text"><b>截图识码</b><i>二维码 / 条码</i></span>
        <span class="kbd" id="hkQr">Ctrl+Alt+D</span>
      </button>
      <button class="shot-btn" id="btnOcr">
        <span class="shot-ico">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 4h14v16H5z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.7"/></svg>
        </span>
        <span class="shot-text"><b>截图识字</b><i>中文 / 英文 / 混排</i></span>
        <span class="kbd" id="hkOcr">Ctrl+Alt+X</span>
      </button>
      <p class="tips">按下快捷键即可直接截屏；截屏时本窗口会自动隐藏。</p>
    </section>

    <section class="panel engine-panel">
      <div class="panel-title"><span>识别引擎</span><button class="link" id="btnRecheck">重新检测</button></div>
      <div class="engine-row">
        <div class="engine-name" id="engineName">—</div>
        <div class="engine-badge" id="engineBadge">—</div>
      </div>
      <div class="engine-desc" id="engineDesc">—</div>
    </section>
  </aside>
</main>

<footer class="statusbar">
  <span class="status" id="status">就绪</span>
  <span class="status-right"><span id="verText">—</span><span class="sep">·</span><span id="rtText">WebView2</span></span>
</footer>

<!-- 设置抽屉 -->
<div class="drawer-mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h2>设置</h2>
    <button class="icon-btn" id="btnCloseDrawer" title="关闭">✕</button>
  </div>

  <div class="drawer-body">
    <div class="group">
      <div class="group-title">识别引擎</div>
      <div class="engine-list" id="engineList"></div>
      <div class="group-note" id="engineNote">只读取本软件自己的「OCR Model」目录；灰掉的是该目录里没找到模型的。</div>
      <div class="row-btns">
        <button class="btn ghost" id="btnRecheck2">重新检测</button>
      </div>
    </div>

    <div class="group">
      <div class="group-title">外观</div>
      <label class="field slider">
        <span>透明度</span>
        <input type="range" id="rgOpacity" min="0" max="100" step="1" value="30">
        <b class="val" id="opacityVal">30%</b>
      </label>
      <label class="field slider">
        <span>毛玻璃</span>
        <input type="range" id="rgFrost" min="0" max="20" step="1" value="3">
        <b class="val" id="frostVal">3</b>
      </label>
      <div class="group-note">透明度越低，背景图透出越多；毛玻璃强度越高，背景越糊。</div>
    </div>

    <div class="group">
      <div class="group-title">截图方式</div>
      <label class="switch-row">
        <div><b>自由圈选</b><i>按住鼠标画出任意形状，只识别圈住的区域</i></div>
        <input type="checkbox" id="swFreehand"><span class="sw"></span>
      </label>
    </div>

    <div class="group">
      <div class="group-title">识别之后</div>
      <label class="switch-row">
        <div><b>自动复制</b><i>识别完成后把文字放进剪贴板</i></div>
        <input type="checkbox" id="swAutocopy"><span class="sw"></span>
      </label>
      <label class="switch-row">
        <div><b>识别后显示本软件窗口</b><i>文字识别结束后回到这个窗口</i></div>
        <input type="checkbox" id="swRestoreWin"><span class="sw"></span>
      </label>
      <label class="switch-row">
        <div><b>扫码后显示本软件窗口</b><i>二维码识别结束后回到这个窗口</i></div>
        <input type="checkbox" id="swRestoreQr"><span class="sw"></span>
      </label>
    </div>

    <div class="group">
      <div class="group-title">快捷键</div>
      <label class="field">
        <span>识码</span>
        <input type="text" id="hkQrInput" readonly placeholder="点击后按下组合键">
      </label>
      <label class="field">
        <span>识字</span>
        <input type="text" id="hkOcrInput" readonly placeholder="点击后按下组合键">
      </label>
      <div class="group-note">点击输入框后直接按下组合键即可修改；Esc 取消。</div>
    </div>

    <div class="group about">
      <div class="about-line"><span>版本</span><b id="verText2">—</b></div>
      <div class="about-line"><span>界面</span><b>JadeView 2.0 · Web UI</b></div>
      <div class="about-line"><span>渲染</span><b id="rtText2">系统 WebView2</b></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
